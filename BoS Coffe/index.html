<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bo's Coffee Menu | Homegrown Philippine Coffee</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar">
        <div id="navbar-inner">
            <img src="https://cdn.shopify.com/s/files/1/0405/8411/8424/files/1-2024-06-27_BOS_Primary_Logo_Colors-1.png?v=1722241257" alt="Bo's Coffee Logo" style="height: 60px; width: auto;">
            <p>Ryzo's Coffee Menu</p>
            <button id="order-btn">View Order</button>
        </div>
    </div>

    <video id="banner" src="banner" alt="Bo's Coffee banner" autoplay loop muted playsinline style="height:500px; object-fit: cover; border-radius: 12px;"></video>

    <section id="menu-section">
        <div id="menu-tabs">
            <button class="menu-tab active" data-category="drinks">Drinks</button>
            <button class="menu-tab" data-category="pastries">Pastries</button>
        </div>
        <div id="container"></div>
    </section>


    <div id="myModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Order</h4>
            </div>
            <div class="modal-body" id="cart-body">
            </div>
            <div class="modal-footer">
                <p id="orderNo" style="display:none;"></p>
                <div class="footer-actions">
                    <span id="cartTotal">Total: ₱0</span>
                    <button id="placeOrderBtn">Place Order</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
<script src="index.js"></script>
